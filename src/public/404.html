<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Epistemico '26 - Redirecting...</title>
    <script type="text/javascript">
      // This script handles the redirect for GitHub Pages
      // It takes the current URL path and converts it into a search parameter
      
      // Set this to 1 if your site is at https://<username>.github.io/<repo-name>/
      // Since your repo is Epistemico-26, keep this as 0 if using a custom domain, 
      // or set to 0 and ensure the logic below handles the path correctly.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    </body>
</html>
